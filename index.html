<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Scan Packing</title><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:system-ui,Roboto,sans-serif;background:#f6f1ea;color:#2b1d14;height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{background:#2b1d14;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex:0 0 auto}
.top .angka{flex:1;min-width:0}.top b{font-size:20px}.top small{display:block;opacity:.85;font-size:12px}
#mode{background:#fff2;border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
#hasil{flex:0 0 auto;padding:8px 12px;text-align:center;color:#fff;background:#6b5d52;min-height:64px;display:flex;flex-direction:column;justify-content:center}
#hasil b{font-size:18px}#hasil .no{font-family:monospace;font-size:16px}#hasil small{font-size:12px}
.ok{background:#1f9d55!important}.dua{background:#e8a317!important;color:#2b1d14!important}.tolak{background:#d63a2f!important}
#tengah{flex:1 1 auto;min-height:90px;position:relative;background:#222;overflow:hidden}
#tengah video,#qr{width:100%;height:100%;object-fit:cover}
#kotak{position:absolute;left:10%;right:10%;top:35%;height:30%;border:3px solid #fff;border-radius:8px;pointer-events:none}
#info{position:absolute;bottom:6px;width:100%;text-align:center;color:#fff;font-size:12px;opacity:.85}
#alat{display:none;height:100%;background:#f6f1ea;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#alat .besar{font-size:clamp(48px,14vh,96px);font-weight:800;line-height:1}#alat small{color:#6b5d52}
.mode-alat #alat{display:flex}.mode-alat #kamera{display:none}
#riwayat{flex:0 0 auto;font-size:13px;background:#fff}
#riwayat div{padding:5px 12px;border-left:5px solid #ccc;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#riwayat .r-ok{border-left-color:#1f9d55}#riwayat .r-dua{border-left-color:#e8a317}#riwayat .r-tolak{border-left-color:#d63a2f}
#riwayat .kosong{color:#999;border-left-color:transparent}
.bawah{display:flex;gap:8px;padding:8px;flex:0 0 auto}
.bawah button,.bawah label{flex:1;padding:11px 4px;border:0;border-radius:10px;background:#e9e1d6;color:#2b1d14;font-size:14px;font-weight:600;text-align:center}
@media (max-height:640px){#riwayat div:nth-child(n+4){display:none}#hasil{min-height:52px}}
@media (max-height:540px){#riwayat div:nth-child(n+2){display:none}}
#ketik{position:absolute;left:-999px;opacity:0}
#pinBox{position:fixed;inset:0;background:#2b1d14;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
#pinBox input{font-size:28px;width:180px;text-align:center;padding:8px;border-radius:10px;border:0}
#pinBox button{font-size:18px;padding:10px 30px;border-radius:10px;border:0;background:#1f9d55;color:#fff}
</style></head><body>
<div class="top">
  <svg width="50" height="50" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#fff3" stroke-width="4"/>
  <circle id="cincin" cx="18" cy="18" r="15" fill="none" stroke="#3ddc84" stroke-width="4" stroke-dasharray="0 95" transform="rotate(-90 18 18)" stroke-linecap="round"/>
  <text id="persen" x="18" y="21" fill="#fff" font-size="9" text-anchor="middle" font-weight="700">-</text></svg>
  <div class="angka"><b id="nSelesai">-</b> <span id="nTotal"></span><small id="nSisa">memuat…</small></div>
  <button id="mode" onclick="gantiMode()">📟 Alat</button>
</div>
<div id="hasil"><small>Scan barcode resi yang sudah dicetak</small></div>
<div id="tengah">
  <div id="kamera" style="height:100%"><video id="vid" playsinline muted></video><div id="kotak"></div><div id="info">Menyalakan kamera…</div></div>
  <div id="alat"><small>dipacking hari ini</small><div class="besar" id="nBesar">-</div><small>📟 Tinggal tembak barcode resi</small></div>
</div>
<div id="riwayat"></div>
<div class="bawah">
  <button onclick="manual()">⌨️ Ketik resi</button>
  <label id="lblFoto">📷 Foto barcode<input id="foto" type="file" accept="image/*" capture="environment" hidden></label>
</div>
<input id="ketik" inputmode="none" autocomplete="off">
<div id="pinBox"><div>Masukkan PIN gudang</div><input id="pin" type="password" inputmode="numeric"><button onclick="simpanPin()">Masuk</button><div id="pinErr" style="color:#f99"></div></div>

<script>
// --- pengganti google.script.run (halaman di luar Apps Script) ---
var API_SCAN = 'https://script.google.com/macros/s/AKfycbwE0yCieSPVoF0-X28mnET6vEb0RAXeDfMqE8BG7bZsG13Ol7XEx5_X8qNMwtlNHekcMA/exec';
function panggilServer(fn, args) {
  return fetch(API_SCAN, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) throw new Error(j.error); return j.hasil; });
}
function pelari(s, f) {
  return new Proxy({}, { get: function (_, k) {
    if (k === 'withSuccessHandler') return function (x) { return pelari(x, f); };
    if (k === 'withFailureHandler') return function (x) { return pelari(s, x); };
    return function () {
      panggilServer(k, [].slice.call(arguments))
        .then(function (h) { if (s) s(h); }, function (e) { if (f) f(e); });
    };
  } });
}
var google = { script: { run: pelari(null, null) } };

var $ = function (id) { return document.getElementById(id); };
function simpan(k, v) { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) {} }
function baca(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
var PIN = baca('pinGudang') || '';
var MODE = baca('modeScan') === 'alat' ? 'alat' : 'kamera';
var riwayat = []; try { riwayat = JSON.parse(baca('riwayatScan') || '[]'); } catch (e) {}
var sibuk = false, terakhir = '', waktuTerakhir = 0, detektor = null, html5 = null, stream = null, loopJalan = false, sudahMulai = false;

function gantiPin() { PIN = ''; try { localStorage.removeItem('pinGudang'); } catch (e) {} $('pinBox').style.display = 'flex'; }
function simpanPin() {
  var p = $('pin').value.trim();
  google.script.run.withSuccessHandler(function () {
    PIN = p; simpan('pinGudang', p); $('pinBox').style.display = 'none'; $('pinErr').textContent = ''; mulai();
  }).withFailureHandler(function (e) { $('pinErr').textContent = (e && e.message) || 'PIN salah'; }).cekPin(p);
}

// ---- bunyi & getar ----
var ac = null;
function bunyi(nada) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    nada.forEach(function (n, i) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = n[0]; o.type = n[0] < 400 ? 'square' : 'sine';
      o.connect(g); g.connect(ac.destination);
      var t = ac.currentTime + i * 0.18; g.gain.setValueAtTime(0.4, t); o.start(t); o.stop(t + n[1]);
    });
  } catch (e) {}
}
function getar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

function tampil(r) {
  var h = $('hasil'); h.className = r.hasil;
  var judul = { ok: '✓ SUDAH DIPACKING', dua: '! SUDAH DI-SCAN', tolak: '✕ JANGAN DIKIRIM' }[r.hasil] || r.hasil;
  var ket = r.pesan || '';
  if (r.hasil === 'dua') ket += ' — jangan dikirim dobel';
  if (r.hasil === 'tolak') ket += ' — serahkan ke admin';
  h.innerHTML = '<b></b><span class="no"></span><small></small>';
  h.querySelector('b').textContent = judul;
  h.querySelector('.no').textContent = r.resi || '';
  h.querySelector('small').textContent = (r.kurir ? r.kurir + ' · ' : '') + ket;
  if (r.hasil === 'ok') { bunyi([[1500, 0.15]]); getar(80); }
  else if (r.hasil === 'dua') { bunyi([[700, 0.2]]); getar([200, 100, 200]); }
  else { bunyi([[250, 0.15], [250, 0.15], [250, 0.15]]); getar([400, 100, 400]); }
  if (r.resi) {
    var d = new Date(), jam = ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2);
    riwayat.unshift({ h: r.hasil, resi: r.resi, ket: { ok: 'OK', dua: 'sudah di-scan', tolak: r.pesan || 'ditolak' }[r.hasil], jam: jam });
    riwayat = riwayat.slice(0, 5); simpan('riwayatScan', riwayat); gambarRiwayat();
  }
}
function gambarRiwayat() {
  var el = $('riwayat'); el.innerHTML = '';
  for (var i = 0; i < 5; i++) {
    var d = document.createElement('div'), x = riwayat[i];
    if (x) { d.className = 'r-' + x.h; d.textContent = x.jam + '  ' + x.resi + ' · ' + x.ket; }
    else { d.className = 'kosong'; d.textContent = i === 0 ? 'Belum ada scan di HP ini' : '·'; }
    el.appendChild(d);
  }
}

function kirim(kode) {
  kode = String(kode || '').trim();
  if (!kode || sibuk) return;
  var now = Date.now();
  if (kode === terakhir && now - waktuTerakhir < 4000) return;
  terakhir = kode; waktuTerakhir = now; sibuk = true;
  var h = $('hasil'); h.className = ''; h.innerHTML = '<small></small>'; h.firstChild.textContent = 'Mengecek ' + kode + '…';
  google.script.run.withSuccessHandler(function (r) { sibuk = false; tampil(r); muatRingkasan(); })
    .withFailureHandler(function (e) {
      sibuk = false; terakhir = '';
      if (String(e && e.message || e).indexOf('PIN') >= 0) return gantiPin();
      tampil({ hasil: 'tolak', resi: kode, pesan: 'Gagal kirim (internet?) — scan ulang' });
    }).tandaiPacking(PIN, kode);
}
function muatRingkasan() {
  google.script.run.withSuccessHandler(function (s) {
    var pct = s.total ? Math.round(s.selesai * 100 / s.total) : 0;
    $('cincin').setAttribute('stroke-dasharray', (pct * 0.9425).toFixed(1) + ' 95');
    $('persen').textContent = s.total ? pct + '%' : '-';
    $('nSelesai').textContent = s.selesai; $('nTotal').textContent = '/ ' + s.total;
    $('nSisa').textContent = 'resi hari ini · sisa ' + s.sisa + (s.sisaKemarin ? ' (+' + s.sisaKemarin + ' kemarin)' : '');
    $('nBesar').textContent = s.dipacking;
  }).ringkasan(PIN);
}
function manual() { var k = prompt('Ketik nomor resi'); if (k) { terakhir = ''; kirim(k); } }

// ---- alat scan (keyboard): ketik + Enter ----
$('ketik').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { var v = this.value; this.value = ''; terakhir = ''; kirim(v); }
});
setInterval(function () {
  var a = document.activeElement;
  if ($('pinBox').style.display !== 'flex' && (!a || a.tagName !== 'INPUT' || a.id === 'ketik')) $('ketik').focus();
}, 800);

// ---- foto barcode ----
$('foto').addEventListener('change', function () {
  var f = this.files[0]; this.value = ''; if (!f) return;
  var gagal = function () { tampil({ hasil: 'tolak', pesan: 'Barcode tidak terbaca, foto lebih dekat' }); };
  if (detektor) {
    createImageBitmap(f).then(function (b) { return detektor.detect(b); })
      .then(function (r) { r.length ? kirim(r[0].rawValue) : gagal(); }).catch(gagal);
  } else if (window.Html5Qrcode) {
    new Html5Qrcode('tmpQr').scanFile(f, false).then(kirim).catch(gagal);
  } else gagal();
});

// ---- kamera ----
var FORMAT = ['code_128', 'code_39', 'ean_13', 'qr_code'];
if ('BarcodeDetector' in window) { try { detektor = new BarcodeDetector({ formats: FORMAT }); } catch (e) {} }
function nyalakanKamera() {
  $('info').textContent = 'Menyalakan kamera…';
  if (detektor) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } })
      .then(function (s) {
        stream = s; var v = $('vid'); v.srcObject = s; v.play(); $('info').textContent = 'Arahkan ke barcode resi';
        if (loopJalan) return; loopJalan = true;
        (function loop() {
          if (MODE === 'kamera' && v.readyState >= 2 && !sibuk) detektor.detect(v).then(function (r) { if (r.length) kirim(r[0].rawValue); }).catch(function () {});
          setTimeout(loop, 250);
        })();
      }).catch(kameraGagal);
  } else {
    muatHtml5(function () {
      $('vid').style.display = 'none';
      if (!$('qr')) { var d = document.createElement('div'); d.id = 'qr'; $('kamera').prepend(d); }
      html5 = html5 || new Html5Qrcode('qr');
      html5.start({ facingMode: 'environment' }, { fps: 8, qrbox: { width: 240, height: 100 } }, kirim)
        .then(function () { $('info').textContent = 'Arahkan ke barcode resi'; }).catch(kameraGagal);
    });
  }
}
function matikanKamera() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (html5) { try { html5.stop(); } catch (e) {} }
}
function muatHtml5(cb) {
  if (window.Html5Qrcode) return cb();
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  s.onload = function () { var t = document.createElement('div'); t.id = 'tmpQr'; t.style.display = 'none'; document.body.appendChild(t); cb(); };
  s.onerror = kameraGagal; document.head.appendChild(s);
}
function kameraGagal() { $('info').textContent = 'Kamera tidak bisa dibuka. Pakai 📷 Foto barcode atau 📟 Alat.'; }
if (!detektor) muatHtml5(function () {});

function terapkanMode() {
  document.body.classList.toggle('mode-alat', MODE === 'alat');
  $('mode').textContent = MODE === 'alat' ? '📷 Kamera' : '📟 Alat';
  $('lblFoto').style.display = MODE === 'alat' ? 'none' : '';
  if (MODE === 'alat') matikanKamera(); else if (sudahMulai) nyalakanKamera();
}
function gantiMode() { MODE = MODE === 'alat' ? 'kamera' : 'alat'; simpan('modeScan', MODE); terapkanMode(); $('ketik').focus(); }

function mulai() {
  sudahMulai = true; muatRingkasan(); setInterval(muatRingkasan, 60000);
  if (MODE === 'kamera') nyalakanKamera();
}
gambarRiwayat(); terapkanMode();
if (PIN) google.script.run.withSuccessHandler(mulai).withFailureHandler(gantiPin).cekPin(PIN);
else gantiPin();
</script>
</body></html>
